# 안드로이드 앱 번들(.aab) 만들기 — 직접 실행(Actions > android > Run workflow)
# 필요한 Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# 선택 Secrets : ADMOB_APP_ID_ANDROID(AdMob 안드로이드 앱 ID), ADMOB_BANNER_ID_ANDROID(배너 광고 단위 ID) — 없으면 구글 테스트 광고
name: android

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (Play에 올릴 때마다 1씩 올려야 함)'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build # 빌드 전에 최신 당첨 데이터를 자동으로 받음
        env:
          CI: 'true'
          VITE_ADMOB_BANNER_ID_ANDROID: ${{ secrets.ADMOB_BANNER_ID_ANDROID }}
      - run: npx cap sync android
      - name: 서명 키 풀기
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: 번들 만들기
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: lotto-day-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
