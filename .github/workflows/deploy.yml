# 매주 토요일 추첨 직후 최신 당첨번호·판매점을 받아 다시 배포 (GitHub Pages, 무료)
# 설정: 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 바꾸면 끝
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # 추첨 20:35 → 당첨번호 20:50쯤, 당첨판매점 21:15쯤 (행사로 늦어지면 22:30쯤)
    # 토요일 밤 한국 시간 20:50~23:40 사이 20분마다 확인 (UTC 11:50 / 12:00~14:40)
    # 새 데이터가 아직 없으면 있는 그대로 다시 배포될 뿐이라 해가 없음
    - cron: '50 11 * * 6'
    - cron: '*/20 12-14 * * 6'
    # 그래도 놓쳤을 때를 위한 일요일 아침 9시 한 번
    - cron: '0 0 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prebuild 가 동행복권에서 데이터를 받음. 실패하면 이 단계가 빨갛게 되어 메일로 알려줌
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
