# 매주 토요일 추첨 직후 최신 당첨번호·판매점을 받아 다시 배포 (GitHub Pages, 무료)
# 설정: 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 바꾸면 끝
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # 한국 시간 토 20:55 / 21:10 / 21:30 (UTC 11:55 / 12:10 / 12:30)
    # GitHub 예약 실행은 몇 분 늦어질 수 있어 세 번 돌림
    - cron: '55 11 * * 6'
    - cron: '10 12 * * 6'
    - cron: '30 12 * * 6'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prebuild 가 동행복권에서 데이터를 받음. 실패하면 이 단계가 빨갛게 되어 메일로 알려줌
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
